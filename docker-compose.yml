# Development only. In production restrict MongoDB to a private network with authentication.
services:
  mongo:
    image: mongo:8.0@sha256:02a0cc7939f5ed38f30f9bc714ef5f682d49baf9350c54acf302ce833087fe8a
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - yummy-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  yummy-mongo:
